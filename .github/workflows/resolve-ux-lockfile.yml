name: Resolve UX lockfile

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.number == 94
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit resolved lockfile
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: resolve UX dependency lockfile"
          git push origin HEAD:"$HEAD_BRANCH"
