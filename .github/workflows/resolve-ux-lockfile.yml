name: Resolve UX lockfile

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.pull_request.draft == true && github.event.pull_request.number == 94
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ux-package-lock
          path: package-lock.json
          retention-days: 1
