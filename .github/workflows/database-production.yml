name: Production Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # Workflow updates also warrant a protected canonical migration reconciliation.
      # This permits applying already-reviewed backlogged migrations without editing
      # immutable SQL files or writing fake no-op migrations.
      - ".github/workflows/database-production.yml"
  workflow_dispatch:
    inputs:
      expected_migrations:
        description: "Exact ordered pending version_name batch, comma-separated"
        required: true
        type: string
        default: "20261005003000_living_artwork_media_jobs,20261006003000_release_visual_derivative_strategy"

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: deploy canonical migrations
    # No branch other than main may deploy, including through manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Require production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Production environment secret: $name"
              exit 1
            fi
          done

      - name: Verify production is an exact canonical prefix
        run: node scripts/check-supabase-migration-parity.mjs --allow-pending

      - name: Require exact requested batch for manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
        run: node scripts/verify-production-migration-batch.mjs

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Deploy pending migrations once
        run: supabase db push --yes

      - name: Require exact post-deploy parity
        run: node scripts/check-supabase-migration-parity.mjs

      - name: Read back migration history
        run: supabase migration list
