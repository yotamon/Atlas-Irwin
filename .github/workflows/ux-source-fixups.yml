name: UX Source Fixups

on:
  push:
    branches: [feat/ux-foundation-stabilization]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-foundation-stabilization

      - name: Apply verified source-level fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "components/release-widget-client.tsx": [
                  ("New Release", "Selected Release"),
              ],
              "components/studio/automix-studio.tsx": [
                  ("final ceiling reported from the measured render", "final loudness measured · -1.0 dBTP safety ceiling enforced"),
                  ("<small>Measured ceiling</small>", "<small>Safety ceiling</small>"),
              ],
              "app/globals.css": [
                  ('''/* The selected release can be an older catalog item. Never call it "New" purely\n   because it is currently selected in the player. */\n#release-widget .absolute.inset-x-4.bottom-4 p:first-child {\n  font-size: 0 !important;\n}\n\n#release-widget .absolute.inset-x-4.bottom-4 p:first-child::after {\n  content: "Selected Release";\n  font-size: 1rem;\n  letter-spacing: 0.18em;\n}\n\n''', ""),
              ],
          }

          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence of {old!r} in {name}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Commit fixups when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/release-widget-client.tsx components/studio/automix-studio.tsx app/globals.css
          git commit -m "fix(ux): move truthfulness fixes into source"
          git push origin HEAD:feat/ux-foundation-stabilization
