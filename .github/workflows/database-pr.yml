name: Database PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/database-pr.yml"

permissions:
  contents: read

jobs:
  database:
    name: canonical executable function equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init
      - name: Replay full canonical history
        run: supabase db start
      - name: Fingerprint executable function bodies ignoring prose comment lines
        shell: bash
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -At <<'SQL'
          with missing_functions(schema_name,name) as (
            values ('private','validate_automix_transition_preview'),('public','claim_dj_library_pairing'),
              ('public','apply_dj_library_sync_revision'),('public','claim_dj_library_device_jobs'),
              ('public','assert_ensemblis_portable_json_v1'),('public','assert_ensemblis_project_scope_v1'),
              ('public','bootstrap_ensemblis_project_replica_v1'),('public','commit_ensemblis_project_mutation_v1')
          ), functions as (
            select n.nspname schema_name,
              p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' object_name,
              regexp_replace(
                regexp_replace(p.prosrc, E'(^|\\n)[ \\t]*--[^\\n]*(\\n|$)', E'\\1', 'g'),
                E'\\s+', '', 'g'
              ) executable_source
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname in ('public','private')
              and not (n.nspname='public' and p.proname='rls_auto_enable' and p.pronargs=0)
              and not exists (select 1 from missing_functions x where x.schema_name=n.nspname and x.name=p.proname)
          )
          select 'EXECUTABLE_FUNCTIONS|' || count(*) || '|' ||
            encode(digest(convert_to(string_agg(schema_name || E'\x1f' || object_name || E'\x1f' || executable_source,E'\x1e' order by schema_name,object_name,executable_source),'UTF8'),'sha256'),'hex')
          from functions;
          SQL
