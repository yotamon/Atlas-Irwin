name: Database PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/database-pr.yml"

permissions:
  contents: read

jobs:
  database:
    name: canonical shared function audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Replay full canonical history
        run: supabase db start

      - name: Fingerprint canonical functions excluding proven-missing migrations
        shell: bash
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -At <<'SQL'
          with functions as (
            select n.nspname,
                   p.proname,
                   n.nspname || '.' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' as signature
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname in ('public','private')
              and not (
                (n.nspname = 'private' and p.proname = 'validate_automix_transition_preview')
                or (n.nspname = 'public' and p.proname in (
                  'claim_dj_library_pairing',
                  'apply_dj_library_sync_revision',
                  'claim_dj_library_device_jobs',
                  'assert_ensemblis_portable_json_v1',
                  'assert_ensemblis_project_scope_v1',
                  'bootstrap_ensemblis_project_replica_v1',
                  'commit_ensemblis_project_mutation_v1'
                ))
              )
          )
          select 'SHARED_FUNCTION_COUNT|' || count(*) from functions;
          select 'SHARED_FUNCTION_SUM|' || coalesce(sum(hashtextextended(signature, 0)::numeric), 0) from functions;
          select 'SHARED_FUNCTION_NAMES_SHA256|' || encode(digest(convert_to(string_agg(signature, E'\x1e' order by signature),'UTF8'),'sha256'),'hex') from functions;
          SQL
