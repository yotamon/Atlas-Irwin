name: Database PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/database-pr.yml"

permissions:
  contents: read

jobs:
  database:
    name: production-equivalent schema audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Hold migrations proven absent from production
        shell: bash
        run: |
          mkdir -p /tmp/held-migrations
          for name in \
            marketing_creative_brand_media \
            automix_transition_previews \
            dj_intelligence_reset \
            dj_library_devices \
            dj_library_pairing_lint_fix \
            dj_library_planning_evidence \
            dj_library_render_jobs \
            remove_serato_from_dj_library_sources \
            ensemblis_project_sync
          do
            file="$(find supabase/migrations -maxdepth 1 -type f -name "*_${name}.sql" -print -quit)"
            test -n "$file"
            mv "$file" /tmp/held-migrations/
          done

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Replay production-equivalent canonical history
        run: supabase db start

      - name: Emit schema fingerprints
        shell: bash
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -At <<'SQL'
          with objects as (
            select 'relation'::text kind, n.nspname schema_name, c.relname object_name,
                   concat_ws('|', c.relkind::text, c.relrowsecurity::text, c.relforcerowsecurity::text, coalesce(obj_description(c.oid, 'pg_class'), '')) detail
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private') and c.relkind in ('r','p','v','m','S')
            union all
            select 'column', n.nspname, c.relname || '.' || a.attname,
                   concat_ws('|', a.attnum::text, format_type(a.atttypid,a.atttypmod), a.attnotnull::text,
                     coalesce(pg_get_expr(ad.adbin,ad.adrelid),''), a.attidentity::text, a.attgenerated::text,
                     coalesce(col_description(c.oid,a.attnum),''))
            from pg_attribute a
            join pg_class c on c.oid=a.attrelid
            join pg_namespace n on n.oid=c.relnamespace
            left join pg_attrdef ad on ad.adrelid=a.attrelid and ad.adnum=a.attnum
            where n.nspname in ('public','private') and c.relkind in ('r','p','v','m') and a.attnum>0 and not a.attisdropped
            union all
            select 'constraint', n.nspname, c.relname || '.' || con.conname,
                   concat_ws('|', con.contype::text, con.condeferrable::text, con.condeferred::text, con.convalidated::text, pg_get_constraintdef(con.oid,true))
            from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private')
            union all
            select 'index', n.nspname, ci.relname, pg_get_indexdef(i.indexrelid)
            from pg_index i join pg_class ci on ci.oid=i.indexrelid join pg_class ct on ct.oid=i.indrelid join pg_namespace n on n.oid=ct.relnamespace
            where n.nspname in ('public','private')
            union all
            select 'function', n.nspname, p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')', pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private')
            union all
            select 'trigger', n.nspname, c.relname || '.' || t.tgname, pg_get_triggerdef(t.oid,true)
            from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private') and not t.tgisinternal
            union all
            select 'policy', schemaname, tablename || '.' || policyname,
                   concat_ws('|', permissive, roles::text, cmd, coalesce(qual,''), coalesce(with_check,''))
            from pg_policies where schemaname in ('public','private')
            union all
            select 'enum', n.nspname, t.typname || '.' || e.enumsortorder::text, e.enumlabel
            from pg_type t join pg_namespace n on n.oid=t.typnamespace join pg_enum e on e.enumtypid=t.oid
            where n.nspname in ('public','private')
            union all
            select 'viewdef', n.nspname, c.relname, pg_get_viewdef(c.oid,true)
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private') and c.relkind in ('v','m')
            union all
            select 'table_grant', table_schema, table_name || '.' || grantee || '.' || privilege_type, is_grantable
            from information_schema.role_table_grants
            where table_schema in ('public','private') and grantee in ('anon','authenticated','service_role')
            union all
            select 'routine_grant', routine_schema, routine_name || '.' || grantee || '.' || privilege_type, is_grantable
            from information_schema.role_routine_grants
            where routine_schema in ('public','private') and grantee in ('anon','authenticated','service_role')
            union all
            select 'bucket', 'storage', id,
                   concat_ws('|', name, public::text, coalesce(file_size_limit::text,''), coalesce(array_to_string(allowed_mime_types,','),''))
            from storage.buckets
          ), grouped as (
            select kind, count(*) as object_count,
                   encode(digest(convert_to(string_agg(schema_name || E'\x1f' || object_name || E'\x1f' || detail, E'\x1e' order by schema_name, object_name, detail),'UTF8'),'sha256'),'hex') as fingerprint
            from objects group by kind
          )
          select 'SCHEMA_FINGERPRINT|' || kind || '|' || object_count || '|' || fingerprint
          from grouped order by kind;
          SQL
