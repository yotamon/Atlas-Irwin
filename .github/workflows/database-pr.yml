name: Database PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/database-pr.yml"

permissions:
  contents: read

jobs:
  database:
    name: migration file hash audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Emit canonical migration file hashes
        shell: bash
        run: |
          for file in supabase/migrations/*.sql; do
            base="$(basename "$file" .sql)"
            version="${base%%_*}"
            name="${base#*_}"
            hash="$(sha256sum "$file" | awk '{print $1}')"
            bytes="$(wc -c < "$file" | tr -d ' ')"
            printf 'MIGRATION_FILE_HASH|%s|%s|%s|%s\n' "$name" "$version" "$hash" "$bytes"
          done
