name: Database Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-migration-history.mjs"
      - "scripts/check-supabase-migration-parity.mjs"
      - "scripts/audit-supabase-migration-recovery.mjs"
      - "scripts/fixtures/production-migration-recovery-*.json"
      - "tests/migration-history-guard.test.mjs"
      - ".github/workflows/database-pr.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-migration-history.mjs"
      - "scripts/check-supabase-migration-parity.mjs"
      - "scripts/audit-supabase-migration-recovery.mjs"
      - "scripts/fixtures/production-migration-recovery-*.json"
      - "tests/migration-history-guard.test.mjs"
      - ".github/workflows/database-pr.yml"
  workflow_dispatch:

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: migration replay and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test migration history guards
        run: node --test tests/migration-history-guard.test.mjs

      - name: Enforce append-only canonical migration history
        if: github.event_name == 'pull_request'
        run: node scripts/validate-migration-history.mjs --base-ref "origin/${{ github.base_ref }}"

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Replay every migration on a clean database
        run: supabase db start

      - name: Lint Postgres functions
        run: supabase db lint --local --level error --fail-on error

      - name: Verify database behavior
        run: supabase test db --local
