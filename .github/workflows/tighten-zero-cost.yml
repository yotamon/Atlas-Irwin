name: Tighten Zero Cost Preset

on:
  push:
    branches:
      - feat/zero-cost-ai-control

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-cost-ai-control

      - name: Apply conservative free-credit guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path('lib/ai/control-plane.ts')
          text = control.read_text()
          text = text.replace('export const ZERO_COST_TEXT_BUDGET_USD = 4.5;', 'export const ZERO_COST_TEXT_BUDGET_USD = 2.25;', 1)
          old = 'export function isZeroCostPolicy(settings: AiControlSettings) {\n  return settings.hard_stop && Number(settings.image_budget_usd) <= 0 && Number(settings.video_budget_usd) <= 0;\n}'
          new = '''export function isZeroCostPolicy(settings: AiControlSettings) {\n  return settings.hard_stop\n    && settings.routing_mode === "auto"\n    && settings.provider_sort === "cost"\n    && Number(settings.monthly_budget_usd) <= ZERO_COST_TEXT_BUDGET_USD\n    && Number(settings.text_budget_usd) <= ZERO_COST_TEXT_BUDGET_USD\n    && Number(settings.image_budget_usd) <= 0\n    && Number(settings.video_budget_usd) <= 0;\n}'''
          if old not in text:
              raise SystemExit('isZeroCostPolicy marker not found')
          control.write_text(text.replace(old, new, 1))

          page = Path('app/studio/(protected)/settings/ai/page.tsx')
          text = page.read_text().replace('caps text/reasoning at $4.50', 'caps text/reasoning at $2.25', 1)
          marker = '        <Panel title="AI requests">{stats.requests.toLocaleString()}</Panel>\n'
          if marker not in text:
              raise SystemExit('AI requests panel marker not found')
          text = text.replace(marker, marker + '        <Panel title="Cache reuses">{stats.cacheReuses.toLocaleString()}</Panel>\n', 1)
          page.write_text(text)

          tests = Path('tests/ai-control-plane.test.mjs')
          text = tests.read_text().replace(r'/ZERO_COST_TEXT_BUDGET_USD = 4\.5/', r'/ZERO_COST_TEXT_BUDGET_USD = 2\.25/', 1)
          marker = '  assert.match(controlPlane, /cacheHit: true/);\n'
          if marker not in text:
              raise SystemExit('cache test marker not found')
          text = text.replace(marker, marker + '  assert.match(controlPlane, /provider: "atlas-cache"/);\n  assert.match(controlPlane, /cacheSourceRunId/);\n', 1)
          tests.write_text(text)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/control-plane.ts app/studio/'(protected)'/settings/ai/page.tsx tests/ai-control-plane.test.mjs
          git commit -m "fix: make Zero Cost preset conservative"
          git push
