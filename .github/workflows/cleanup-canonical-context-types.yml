name: One-time canonical context and type codemod

on:
  push:
    branches:
      - cleanup/ensemblis-legacy-purge

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ensemblis-legacy-purge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Canonicalize artist context and music types
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const roots = ['app', 'components', 'lib'];
          const extensions = new Set(['.ts', '.tsx', '.js', '.jsx', '.mjs']);
          const typeMap = new Map([
            ['ArtistScopedMusicDatabase', 'Database'],
            ['ArtistScopedRelease', 'Release'],
            ['ArtistScopedTrack', 'Track'],
            ['ArtistScopedHomepagePlacement', 'HomepagePlacement'],
            ['ArtistScopedTrackExternalId', 'TrackExternalId'],
            ['ArtistScopedReleaseExternalLink', 'ReleaseExternalLink'],
            ['ArtistAwareMediaLink', 'MediaLink'],
          ]);

          function filesIn(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...filesIn(full));
              else if (extensions.has(path.extname(entry.name))) out.push(full);
            }
            return out;
          }

          function addDatabaseTypeImports(source, names) {
            if (!names.length) return source;
            const importPattern = /import\s+type\s*\{([^}]*)\}\s*from\s*["']@\/types\/database["'];?/m;
            const match = source.match(importPattern);
            if (match) {
              const existing = match[1]
                .split(',')
                .map((value) => value.trim())
                .filter(Boolean);
              const merged = [...new Set([...existing, ...names])].sort();
              return source.replace(match[0], `import type {\n  ${merged.join(',\n  ')},\n} from "@/types/database";`);
            }
            return `import type { ${[...new Set(names)].sort().join(', ')} } from "@/types/database";\n${source}`;
          }

          let changed = 0;
          const files = roots.flatMap(filesIn);
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            const before = source;

            source = source.replaceAll('resolveDefaultArtistContext', 'resolveActiveArtistContext');

            const oldImportPattern = /import\s+type\s*\{([^}]*)\}\s*from\s*["']@\/types\/artist-scoped-music-database["'];?\s*/gm;
            const required = [];
            source = source.replace(oldImportPattern, (match, specifiers) => {
              for (const raw of specifiers.split(',')) {
                const name = raw.trim();
                if (!name) continue;
                const canonical = typeMap.get(name);
                if (!canonical) throw new Error(`Unknown legacy music type ${name} in ${file}`);
                required.push(canonical);
              }
              return '';
            });

            if (required.length) {
              for (const [legacy, canonical] of typeMap) {
                source = source.replace(new RegExp(`\\b${legacy}\\b`, 'g'), canonical);
              }
              source = addDatabaseTypeImports(source, required);
              source = source.replace(
                /return\s+client\s+as\s+unknown\s+as\s+SupabaseClient<Database>;/g,
                'return client;',
              );
            }

            if (source !== before) {
              fs.writeFileSync(file, source);
              changed += 1;
            }
          }

          const contractPath = 'tests/studio-v2-contract.test.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          contract = contract.replace(
            '  assert.ok(context.includes("resolveArtistContext(client, identity, preferredArtistId)"));\n  assert.ok(context.includes("resolveLegacyFallbackArtistContext"));\n  assert.ok(context.includes("return resolveActiveArtistContext(client, identity);"));\n  assert.equal(context.includes("return resolveDefaultArtistContext(client, identity);"), false);',
            '  assert.ok(context.includes("resolveArtistContext(client, identity, preferredArtistId)"));\n  assert.equal(context.includes("resolveLegacyFallbackArtistContext"), false);\n  assert.ok(context.includes("resolveUnambiguousArtistContext"));\n  assert.equal(context.includes("resolveDefaultArtistContext"), false);',
          );
          fs.writeFileSync(contractPath, contract);

          const databasePath = 'types/database.ts';
          let database = fs.readFileSync(databasePath, 'utf8');
          database = database.replace(
            '  | "cover_alt"\n  | "public_release_path"',
            '  | "cover_alt"\n  | "canvas_video_url"\n  | "public_release_path"',
          );
          database = database.replace(
            '  | "spotify_url"\n  | "soundcloud_url"',
            '  | "spotify_url"\n  | "apple_music_url"\n  | "soundcloud_url"',
          );
          database = database.replace(
            '  | "youtube_url"\n  | "smart_link_url";',
            '  | "youtube_url"\n  | "bandcamp_url"\n  | "smart_link_url";',
          );
          fs.writeFileSync(databasePath, database);

          const forbidden = ['resolveDefaultArtistContext', 'artist-scoped-music-database', 'ArtistScopedMusicDatabase'];
          const unresolved = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const token of forbidden) {
              if (source.includes(token)) unresolved.push(`${file}: ${token}`);
            }
          }
          if (unresolved.length) {
            console.error(unresolved.join('\n'));
            process.exit(1);
          }

          console.log(`Updated ${changed} runtime files and canonical contracts.`);
          NODE

      - name: Validate changed text
        run: git diff --check

      - name: Remove one-time workflow and commit codemod
        shell: bash
        run: |
          rm .github/workflows/cleanup-canonical-context-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: canonicalize artist context and music types"
          git push origin HEAD:cleanup/ensemblis-legacy-purge
