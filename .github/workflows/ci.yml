name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: fast verification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies once
        timeout-minutes: 8
        run: npm ci --no-audit --fetch-retries=2 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      - name: Verify no legacy runtime compatibility
        run: npm run verify:no-runtime-legacy

      - name: Verify Studio product contracts
        run: npm run test:studio

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Track Intelligence benchmark evaluator
        run: node --check scripts/evaluate-track-intelligence.mjs

      - name: Validate Media Worker check script
        run: node --check scripts/check-media-worker.mjs

      - name: Verify Vercel build-scope guard
        run: node --test tests/vercel-ignore-build.test.mjs

      - name: Audit production dependencies
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          audited_lock_blob="4f901cc3bee6ae40b29f4c3796ce2e2c8eacabf0"
          current_lock_blob="$(git hash-object package-lock.json)"

          if [ "$current_lock_blob" = "$audited_lock_blob" ]; then
            if timeout 45s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=35000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::npm advisory service timed out; reusing clean production-audit proof for unchanged package-lock blob $audited_lock_blob"
              exit 0
            fi
            exit "$status"
          fi

          for attempt in 1 2; do
            if timeout 60s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=45000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            sleep 5
          done

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: your-publishable-or-legacy-anon-key

  e2e:
    name: browser smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        timeout-minutes: 8
        run: npm ci --no-audit --fetch-retries=2 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      # Keep browser tooling out of the production dependency graph. The exact
      # Playwright version is pinned here and installed ephemerally for CI.
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
