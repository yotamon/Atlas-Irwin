name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies once
        timeout-minutes: 8
        run: npm ci --no-audit --fetch-retries=2 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      - name: Verify Studio product contracts
        run: npm run test:studio

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Track Intelligence benchmark evaluator
        run: node --check scripts/evaluate-track-intelligence.mjs

      - name: Validate Media Worker check script
        run: node --check scripts/check-media-worker.mjs

      # Everything below this line is deliberately outside the PR hot path.
      # It still runs on main, nightly, and manual dispatch so regressions remain visible.
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit production dependencies
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          audited_lock_blob="4f901cc3bee6ae40b29f4c3796ce2e2c8eacabf0"
          current_lock_blob="$(git hash-object package-lock.json)"

          if [ "$current_lock_blob" = "$audited_lock_blob" ]; then
            if timeout 45s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=35000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::npm advisory service timed out; reusing clean production-audit proof for unchanged package-lock blob $audited_lock_blob"
              exit 0
            fi
            exit "$status"
          fi

          for attempt in 1 2; do
            if timeout 60s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=45000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            sleep 5
          done

      - name: Validate media worker Python
        if: github.event_name != 'pull_request'
        run: python -m py_compile services/media-worker/app/main.py services/media-worker/app/music_intelligence.py services/media-worker/app/stem_intelligence.py services/media-worker/app/social_finishing.py services/media-worker/app/runner.py

      - name: Install Track Intelligence test DSP dependencies
        if: github.event_name != 'pull_request'
        run: python -m pip install numpy==2.2.6 librosa==0.11.0 soundfile==0.13.1 pyloudnorm==0.1.1

      - name: Run Track Intelligence behavioral regression tests
        if: github.event_name != 'pull_request'
        run: python -m unittest discover -s services/media-worker/tests -p 'test_*.py' -v

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: your-publishable-or-legacy-anon-key

  database:
    name: database migrations and behavior
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Replay every migration on a clean database
        run: supabase db start

      - name: Lint Postgres functions
        run: supabase db lint --local --level error --fail-on error

      - name: Verify database behavior
        run: supabase test db --local
