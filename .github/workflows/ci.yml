name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: fast verification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies once
        timeout-minutes: 8
        run: npm ci --no-audit --fetch-retries=2 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      - name: Diagnose human-factors contract
        continue-on-error: true
        run: node --test tests/ensemblis-ux-human-factors.test.mjs

      - name: Diagnose V5 UX contract
        continue-on-error: true
        run: node --test tests/ensemblis-ux-v5-contract.test.mjs

      - name: Diagnose UX polish contract
        continue-on-error: true
        run: node --test tests/ensemblis-ux-polish-contract.test.mjs

      - name: Diagnose Create contract
        continue-on-error: true
        run: node --test tests/outcome-first-create.test.mjs tests/evidence-first-create.test.mjs

      - name: Diagnose Today contracts
        continue-on-error: true
        run: node --test tests/artist-operating-system-contract.test.mjs tests/studio-product-lifecycle.test.mjs

      - name: Diagnose Studio V2 contract
        continue-on-error: true
        run: node --test tests/studio-v2-contract.test.mjs tests/studio-v2-workflow.test.mjs

      - name: Diagnose Studio batch 1
        continue-on-error: true
        run: node --test tests/ai-control-plane.test.mjs tests/ai-provider-presets.test.mjs tests/architecture-boundaries.test.mjs tests/artist-first-onboarding.test.mjs tests/artist-memory-consumers.test.mjs tests/artist-operating-system-contract.test.mjs tests/artist-scope-contract.test.mjs tests/audio-metadata-ready.test.mjs tests/automix-design-contract.test.mjs tests/automix-durable-recovery.test.mjs tests/automix-production-hardening-contract.test.mjs tests/automix-set-intelligence-contract.test.mjs tests/automix-terminal-callback-contract.test.mjs tests/autonomous-marketing.test.mjs tests/autonomy-contracts.test.mjs tests/content-factory-runtime.test.mjs tests/creative-memory-contract.test.mjs tests/creative-production-os.test.mjs tests/decision-language-contract.test.mjs tests/distribution-artist-scope.test.mjs

      - name: Diagnose Studio batch 2
        continue-on-error: true
        run: node --test tests/distribution-corrections.test.mjs tests/distribution-last-mile-contract.test.mjs tests/distribution-os.test.mjs tests/dj-intelligence-reset.test.mjs tests/dj-library-phase-6-contract.test.mjs tests/dj-library-phase-7-rekordbox.test.mjs tests/dj-library-phase-8-bridge.test.mjs tests/dj-library-phase-8-windows-icon.test.mjs tests/dj-library-phase-9-contract.test.mjs tests/durable-background-execution.test.mjs tests/ensemblis-design-system-contract.test.mjs tests/ensemblis-entry-contract.test.mjs tests/ensemblis-form-system-contract.test.mjs tests/ensemblis-intent-resolution.test.mjs tests/ensemblis-mission-contract.test.mjs tests/ensemblis-sites-contract.test.mjs tests/ensemblis-sites-refresh-contract.test.mjs tests/ensemblis-sites-routing-contract.test.mjs tests/ensemblis-sites-url-safety.test.mjs tests/ensemblis-ux-human-factors.test.mjs

      - name: Diagnose Studio batch 3
        continue-on-error: true
        run: node --test tests/ensemblis-ux-polish-contract.test.mjs tests/ensemblis-ux-v5-contract.test.mjs tests/ensemblis-visual-contract.test.mjs tests/evidence-first-create.test.mjs tests/fan-graph-contract.test.mjs tests/invisible-complexity-foundation.test.mjs tests/library-bridge-platform-core.test.mjs tests/local-first-native-contract.test.mjs tests/local-first-platform.test.mjs tests/lyrics-intelligence.test.mjs tests/lyrics-timing.test.mjs tests/marketing-creative-lineage.test.mjs tests/marketing-intelligence-v2.test.mjs tests/marketing-return-path.test.mjs tests/master-readiness-experience.test.mjs tests/mastering-v2.test.mjs tests/media-worker-bootstrap-contract.test.mjs tests/media-worker-ci-contract.test.mjs tests/media-worker-contract-v1.test.mjs tests/media-worker-snapshot-cleanup.test.mjs

      - name: Diagnose Studio batch 4
        continue-on-error: true
        run: node --test tests/media-worker-snapshot-retention.test.mjs tests/migration-history-guard.test.mjs tests/moment-calibration-contract.test.mjs tests/moments-v2-curation.test.mjs tests/music-ingestion-contract.test.mjs tests/music-ingestion-pipeline-contract.test.mjs tests/music-ingestion-recovery-contract.test.mjs tests/music-intelligence-sentinel.test.mjs tests/music-intelligence.test.mjs tests/music-release-track-lineage.test.mjs tests/needs-you-canonical-contract.test.mjs tests/outcome-first-create.test.mjs tests/paid-growth-contract.test.mjs tests/platform-foundation.test.mjs tests/product-quality-program.test.mjs tests/production-recovery.test.mjs tests/project-sync-server-contract.test.mjs tests/public-catalog-artist-scope.test.mjs tests/quick-video-contract.test.mjs tests/quick-video-social-delivery-contract.test.mjs

      - name: Diagnose Studio batch 5
        continue-on-error: true
        run: node --test tests/release-detail-resilience.test.mjs tests/resumable-upload-recovery.test.mjs tests/smart-links-attribution.test.mjs tests/social-channel-planning.test.mjs tests/stem-intelligence.test.mjs tests/strongest-moments-context.test.mjs tests/studio-product-lifecycle.test.mjs tests/studio-ui-system.test.mjs tests/studio-v2-contract.test.mjs tests/studio-v2-workflow.test.mjs tests/track-analysis-design-contract.test.mjs tests/track-intelligence-recovery-contract.test.mjs tests/vercel-build-budget.test.mjs tests/vercel-ignore-build.test.mjs tests/video-director-editor-state.test.mjs tests/video-director-editor.test.mjs tests/video-director-media-palette.test.mjs tests/video-director-media-scope.test.mjs tests/visual-brand-dna-contract.test.mjs

      - name: Verify Studio product contracts
        run: npm run test:studio

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Track Intelligence benchmark evaluator
        run: node --check scripts/evaluate-track-intelligence.mjs

      - name: Validate Media Worker check script
        run: node --check scripts/check-media-worker.mjs

      - name: Verify Vercel build-scope guard
        run: node --test tests/vercel-ignore-build.test.mjs

      - name: Audit production dependencies
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          audited_lock_blob="4f901cc3bee6ae40b29f4c3796ce2e2c8eacabf0"
          current_lock_blob="$(git hash-object package-lock.json)"

          if [ "$current_lock_blob" = "$audited_lock_blob" ]; then
            if timeout 45s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=35000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::npm advisory service timed out; reusing clean production-audit proof for unchanged package-lock blob $audited_lock_blob"
              exit 0
            fi
            exit "$status"
          fi

          for attempt in 1 2; do
            if timeout 60s npm audit --omit=dev --audit-level=high --fetch-retries=1 --fetch-timeout=45000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            sleep 5
          done

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: your-publishable-or-legacy-anon-key

  e2e:
    name: browser smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        timeout-minutes: 8
        run: npm ci --no-audit --fetch-retries=2 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      # Keep browser tooling out of the production dependency graph. The exact
      # Playwright version is pinned here and installed ephemerally for CI.
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run public and unauthenticated browser smoke suite
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

      - name: Explain authenticated Studio acceptance boundary
        run: |
          echo "The generic smoke job does not claim authenticated Studio acceptance."
          echo "Run 'npm run test:e2e:studio' with STUDIO_E2E_EMAIL/STUDIO_E2E_PASSWORD or the safe localhost service-role path."

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
