name: Artist Scope Audit

on:
  push:
    branches:
      - feat/ensemblis-operational-artist-scope

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate remaining artist-scope references
        shell: bash
        run: |
          set +e
          echo '=== owner_id filters in Studio protected surfaces ==='
          rg -n --fixed-strings '.eq("owner_id"' 'app/studio/(protected)' || true
          echo '=== owner_id filters in Studio action files ==='
          rg -n --fixed-strings '.eq("owner_id"' app/studio --glob '*.ts' --glob '*.tsx' || true
          echo '=== owner_id filters in marketing services ==='
          rg -n --fixed-strings '.eq("owner_id"' lib/marketing || true
          echo '=== owner_id row writes in operational application code ==='
          rg -n 'owner_id\s*:' app/studio lib/marketing || true
          echo '=== operational table access in protected surfaces ==='
          rg -n 'campaigns|content_items|publication_jobs|marketing_learnings|metric_snapshots|outreach_|automation_jobs|next_best_actions|social_channel_accounts|generation_runs' 'app/studio/(protected)' || true
          echo '=== ArtistContext usage ==='
          rg -n 'requireArtistContext|resolveDefaultArtistContext|resolveArtistContext' app/studio lib/marketing || true
          exit 0
