name: Artist Scope Audit

on:
  push:
    branches:
      - feat/ensemblis-operational-artist-scope

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate remaining artist-scope references
        shell: bash
        run: |
          set +e
          echo '=== owner_id filters in Studio protected surfaces ==='
          grep -RInF '.eq("owner_id"' 'app/studio/(protected)' --include='*.ts' --include='*.tsx' || true
          echo '=== owner_id filters in Studio action files ==='
          grep -RInF '.eq("owner_id"' app/studio --include='*.ts' --include='*.tsx' || true
          echo '=== owner_id filters in marketing services ==='
          grep -RInF '.eq("owner_id"' lib/marketing --include='*.ts' --include='*.tsx' || true
          echo '=== owner_id row writes in operational application code ==='
          grep -RInE 'owner_id[[:space:]]*:' app/studio lib/marketing --include='*.ts' --include='*.tsx' || true
          echo '=== operational table access in protected surfaces ==='
          grep -RInE 'campaigns|content_items|publication_jobs|marketing_learnings|metric_snapshots|outreach_|automation_jobs|next_best_actions|social_channel_accounts|generation_runs' 'app/studio/(protected)' --include='*.ts' --include='*.tsx' || true
          echo '=== ArtistContext usage ==='
          grep -RInE 'requireArtistContext|resolveDefaultArtistContext|resolveArtistContext' app/studio lib/marketing --include='*.ts' --include='*.tsx' || true
          exit 0
