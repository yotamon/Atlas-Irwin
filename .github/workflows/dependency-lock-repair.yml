name: Dependency Lock Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.ref == 'fix/dependency-security-audit' && github.actor == 'yotamon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the current lockfile
        run: npm ci --ignore-scripts --no-audit

      - name: Repair vulnerable dependency resolutions
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit repaired lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): resolve production audit advisories"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
