name: Audio Intelligence CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/media-worker/app/music_intelligence*.py"
      - "services/media-worker/app/strongest_moments.py"
      - "services/media-worker/app/mastering_inspector.py"
      - "services/media-worker/app/mastering_processor.py"
      - "services/media-worker/app/stem_intelligence*.py"
      - "services/media-worker/app/audio_intelligence_providers.py"
      - "services/media-worker/app/automix*.py"
      - "services/media-worker/app/runner.py"
      - "services/media-worker/benchmarks/**"
      - "services/media-worker/tests/test_*.py"
      - "services/media-worker/requirements*.txt"
      - "lib/media-worker/**"
      - "lib/automix/**"
      - "lib/music-intelligence/**"
      - "lib/mastering/**"
      - "lib/lyrics-intelligence/**"
      - "scripts/evaluate-track-intelligence.mjs"
      - "supabase/migrations/*audio*intelligence*.sql"
      - "supabase/migrations/*automix*.sql"
      - "tests/music-intelligence.test.mjs"
      - ".github/workflows/audio-intelligence-ci.yml"
  workflow_dispatch:

concurrency:
  group: audio-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-audio-regression:
    name: deep audio regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deterministic DSP test dependencies
        run: >-
          python -m pip install
          numpy==2.2.6
          librosa==0.11.0
          soundfile==0.13.1
          pyloudnorm==0.1.1
          imageio-ffmpeg==0.6.0
          httpx==0.28.1
          pydantic==2.11.7
          python-stretch==0.3.1

      - name: Install benchmark-only audio validation dependencies
        run: python -m pip install -r services/media-worker/requirements-audio-benchmark.txt

      - name: Compile canonical, V4, benchmark and AutoMix modules
        run: >-
          python -m py_compile
          services/media-worker/app/main.py
          services/media-worker/app/music_intelligence.py
          services/media-worker/app/music_intelligence_v4.py
          services/media-worker/app/music_intelligence_v4_runtime.py
          services/media-worker/app/strongest_moments.py
          services/media-worker/app/mastering_inspector.py
          services/media-worker/app/mastering_processor.py
          services/media-worker/app/audio_intelligence_providers.py
          services/media-worker/app/stem_intelligence.py
          services/media-worker/app/stem_intelligence_v3.py
          services/media-worker/app/social_finishing.py
          services/media-worker/app/automix_model.py
          services/media-worker/app/automix_intelligence.py
          services/media-worker/app/automix_planner.py
          services/media-worker/app/automix_dsp.py
          services/media-worker/app/automix.py
          services/media-worker/app/runner.py
          services/media-worker/benchmarks/evaluate_mir.py
          services/media-worker/benchmarks/generate_robustness_corpus.py
          services/media-worker/benchmarks/robustness_metrics.py

      - name: Run complete Media Worker behavioral regression suite
        working-directory: services/media-worker
        run: python -m unittest discover -s tests -p 'test_*.py' -v
