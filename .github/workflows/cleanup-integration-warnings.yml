name: Cleanup integration warnings

on:
  push:
    branches: [feature/atlas-studio-intelligence]

permissions:
  contents: write

concurrency:
  group: cleanup-atlas-integration-warnings
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atlas-studio-intelligence

      - name: Remove stale type imports
        run: |
          python - <<'PY'
          from pathlib import Path

          marketing = Path('app/studio/marketing-actions.ts')
          text = marketing.read_text()
          text = text.replace('  MarketingContentItem,\n', '')
          marketing.write_text(text)

          video = Path('app/studio/video-pipeline-actions.ts')
          text = video.read_text()
          text = text.replace('import type { ExtendedMusicVideoProject, VideoDatabase } from "@/types/video-database";', 'import type { VideoDatabase } from "@/types/video-database";')
          video.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No warning cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/studio/marketing-actions.ts app/studio/video-pipeline-actions.ts
          git commit -m "chore: clean integration lint warnings"
          git push origin HEAD:feature/atlas-studio-intelligence
