name: Library Bridge CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/library-bridge/**"
      - "app/api/dj-library/device/**"
      - "app/api/studio/automix/device-plans/**"
      - "app/api/studio/dj-library/**"
      - "app/api/studio/projects/**"
      - "components/studio/library-bridge-panel*"
      - "components/studio/local-set-builder-workspace*"
      - "contracts/**"
      - "lib/automix/source-candidates.ts"
      - "lib/automix/source-contract.ts"
      - "lib/dj-library/**"
      - "lib/media-worker/contract.ts"
      - "lib/platform/**"
      - "lib/project-sync/**"
      - "types/dj-library-bridge-database.ts"
      - "types/project-sync-database.ts"
      - "supabase/migrations/*dj_library*"
      - "supabase/migrations/*ensemblis_project*"
      - "tests/dj-library-phase-8-bridge.test.mjs"
      - "tests/library-bridge-platform-core.test.mjs"
      - "tests/local-first-*.test.mjs"
      - "tests/project-sync-*.test.mjs"
      - "docs/adr/**"
      - "docs/architecture/local-first-*.md"
      - "docs/dj-library-set-intelligence-development-plan.md"
      - ".github/workflows/library-bridge-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/library-bridge/**"
      - "app/api/dj-library/device/**"
      - "app/api/studio/automix/device-plans/**"
      - "app/api/studio/dj-library/**"
      - "app/api/studio/projects/**"
      - "components/studio/library-bridge-panel*"
      - "components/studio/local-set-builder-workspace*"
      - "contracts/**"
      - "lib/automix/source-candidates.ts"
      - "lib/automix/source-contract.ts"
      - "lib/dj-library/**"
      - "lib/media-worker/contract.ts"
      - "lib/platform/**"
      - "lib/project-sync/**"
      - "types/dj-library-bridge-database.ts"
      - "types/project-sync-database.ts"
      - "supabase/migrations/*dj_library*"
      - "supabase/migrations/*ensemblis_project*"
      - "tests/dj-library-phase-8-bridge.test.mjs"
      - "tests/library-bridge-platform-core.test.mjs"
      - "tests/local-first-*.test.mjs"
      - "tests/project-sync-*.test.mjs"
      - "docs/adr/**"
      - "docs/architecture/local-first-*.md"
      - "docs/dj-library-set-intelligence-development-plan.md"
      - ".github/workflows/library-bridge-ci.yml"

permissions:
  contents: read

concurrency:
  group: library-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript test runtime
        run: npm install --ignore-scripts --no-save --package-lock=false typescript@5.9.3
      - name: Build desktop platform core from canonical TypeScript
        run: node apps/library-bridge/build-platform-core.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Library Bridge product/privacy contracts
        run: >-
          node --test
          tests/dj-library-phase-8-bridge.test.mjs
          tests/library-bridge-platform-core.test.mjs
          tests/local-first-platform.test.mjs
          tests/local-first-native-contract.test.mjs
          tests/project-sync-server-contract.test.mjs
      - name: Validate local sidecar Python
        run: >-
          python -m py_compile
          apps/library-bridge/renderer/bridge_analyzer.py
          apps/library-bridge/renderer/bridge_renderer.py
          apps/library-bridge/renderer/bridge_sidecar.py
          apps/library-bridge/renderer/build_sidecar.py
          apps/library-bridge/renderer/prepare_native_ffmpeg.py
          apps/library-bridge/renderer/verify_windows_arm64_python.py
          services/media-worker/app/automix_device_sources.py

  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/library-bridge/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          cache-workspaces: apps/library-bridge/src-tauri
      - name: Rust format
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets

  release-bundle:
    name: release bundle (${{ matrix.label }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundle: nsis
          - os: macos-14
            label: macOS
            bundle: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/library-bridge/renderer/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript build runtime
        run: npm install --ignore-scripts --no-save --package-lock=false typescript@5.9.3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          cache-workspaces: apps/library-bridge/src-tauri
      - name: Install pinned local sidecar dependencies
        run: python -m pip install -r apps/library-bridge/renderer/requirements.txt
      - name: Build and verify target-native sidecar
        run: python apps/library-bridge/renderer/build_sidecar.py
      - name: Build Tauri release bundle
        working-directory: apps/library-bridge
        run: npx --yes @tauri-apps/cli@2.11.4 build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundle }}
      - name: Upload unsigned validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: ensemblis-library-bridge-${{ matrix.label }}-${{ github.sha }}
          path: apps/library-bridge/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  release-bundle-windows-arm64:
    name: release bundle (Windows ARM64)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip
          cache-dependency-path: apps/library-bridge/renderer/requirements-windows-arm64.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript build runtime
        run: npm install --ignore-scripts --no-save --package-lock=false typescript@5.9.3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          cache-workspaces: apps/library-bridge/src-tauri
      - name: Install Windows ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Install Windows ARM64 binary Python foundation
        run: >-
          python -m pip install --only-binary=:all:
          PyInstaller==6.22.2
          numpy==2.5.3
          scipy==1.18.1
          numba==0.67.0
          llvmlite==0.49.0
          scikit-learn==1.9.1
          soundfile==0.14.0
          pyloudnorm==0.2.0
      - name: Build Windows ARM64 source-only audio dependencies
        run: |
          python -m pip install --no-binary=soxr soxr==1.1.0
          python -m pip install --no-binary=imageio-ffmpeg --no-deps imageio-ffmpeg==0.6.0
          python -m pip install --no-binary=python-stretch python-stretch==0.3.1
      - name: Install remaining Windows ARM64 sidecar dependencies
        run: >-
          python -m pip install --only-binary=:all:
          -r apps/library-bridge/renderer/requirements-windows-arm64.txt
      - name: Verify Python dependency binaries are ARM64 native
        run: python apps/library-bridge/renderer/verify_windows_arm64_python.py
      - name: Prepare pinned Windows ARM64 FFmpeg
        run: python apps/library-bridge/renderer/prepare_native_ffmpeg.py --target-triple aarch64-pc-windows-msvc --output apps/library-bridge/renderer/.native-tools/windows-arm64/ffmpeg.exe
      - name: Build and verify Windows ARM64 sidecar
        run: python apps/library-bridge/renderer/build_sidecar.py --target-triple aarch64-pc-windows-msvc --ffmpeg-binary apps/library-bridge/renderer/.native-tools/windows-arm64/ffmpeg.exe
      - name: Build Windows ARM64 Tauri release bundle
        working-directory: apps/library-bridge
        run: npx --yes @tauri-apps/cli@2.11.4 build --config src-tauri/tauri.release.conf.json --bundles nsis --target aarch64-pc-windows-msvc
      - name: Verify Windows ARM64 application executable
        run: python apps/library-bridge/renderer/build_sidecar.py --target-triple aarch64-pc-windows-msvc --verify-binary apps/library-bridge/src-tauri/target/aarch64-pc-windows-msvc/release/ensemblis-library-bridge.exe
      - name: Upload unsigned Windows ARM64 validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: ensemblis-library-bridge-Windows-ARM64-${{ github.sha }}
          path: apps/library-bridge/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error
          retention-days: 7
