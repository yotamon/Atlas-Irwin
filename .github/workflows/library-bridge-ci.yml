name: Library Bridge CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/library-bridge/**"
      - ".github/workflows/library-bridge-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/library-bridge/**"
      - ".github/workflows/library-bridge-ci.yml"

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo validation
