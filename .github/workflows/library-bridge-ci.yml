name: Library Bridge CI

on:
  pull_request:
    paths:
      - "apps/library-bridge/**"
      - "app/api/dj-library/device/**"
      - "app/api/studio/dj-library/**"
      - "lib/dj-library/**"
      - "types/dj-library-bridge-database.ts"
      - "supabase/migrations/*dj_library*"
      - "tests/dj-library-phase-8-bridge.test.mjs"
      - ".github/workflows/library-bridge-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/library-bridge/**"
      - "app/api/dj-library/device/**"
      - "lib/dj-library/**"
      - "supabase/migrations/*dj_library*"
      - ".github/workflows/library-bridge-ci.yml"

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/library-bridge/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          cache-workspaces: apps/library-bridge/src-tauri
      - name: Rust format
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets
